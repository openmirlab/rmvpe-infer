name: Test

# Runs the CI-safe unit test suite (no checkpoint download, no network) on
# every push and pull request. Weight-dependent tests (physics accuracy,
# determinism, golden regression -- pytest marker `weights`) and network
# tests (marker `network`) are excluded here by pyproject.toml's default
# addopts; they require a real RMVPE checkpoint and are run manually with
# `pytest -m weights` / `pytest -m network`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/ -q
