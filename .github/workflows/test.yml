name: Test

# Runs the CI-safe unit test suite (no checkpoint download, no network) on
# every push and pull request. Weight-dependent tests (physics accuracy,
# determinism, golden regression -- pytest marker `weights`) and network
# tests (marker `network`) are excluded here by pyproject.toml's default
# addopts; they require a real RMVPE checkpoint and are run manually with
# `pytest -m weights` / `pytest -m network`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Verify selected interpreter
        run: uv run --no-sync python -c 'import os, sys; expected = tuple(map(int, os.environ["UV_PYTHON"].split("."))); assert sys.version_info[:2] == expected, sys.version'

      - name: Run unit tests
        run: uv run --no-sync pytest tests/ -q
